[package]
name = "keenetic-mobile-monitor"
version = "0.1.0"
edition = "2024"
description = "In-memory Mobile/LTE telemetry monitor and live dashboard for Keenetic routers"
license = "MIT OR Apache-2.0"
authors = ["hexqnt <hexqntlab@gmail.com>"]
repository = "https://github.com/hexqnt/keenetic-mobile-monitor"
readme = "README.md"
keywords = ["keenetic", "lte", "monitoring", "plotly"]
categories = ["command-line-utilities", "network-programming"]

[dependencies]
anyhow = "1.0.102"
async-stream = "0.3.6"
axum = "0.8.9"
clap = { version = "4.6.6", features = ["derive"] }
colored = "3.1.1"
futures-core = "0.3.32"
humantime = "2.3.0"
# keenetic-rci = { path = "../keenetic-rci" }
keenetic-rci = "0.1.1"
maud = "0.27.0"
plotly = "0.14.1"
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = [
    "fs",
    "macros",
    "net",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
] }
toml = "1.1.4"
tower-http = { version = "0.7.0", features = ["cors"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.22"

[dev-dependencies]
http-body-util = "0.1.3"
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

[profile.profiling]
inherits = "release"
debug = 2
strip = false

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
multiple_crate_versions = "allow"

# Work around a rust-clippy 2026-08-23 ICE while it inspects reqwest opaque futures.
large_futures = { level = "allow", priority = 1 }
